services:
  mongo:
    image: mongo:7
    container_name: taskmanager-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - taskmanager-net

  server:
    build: ./server
    container_name: taskmanager-server
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongo:27017/taskmanager
      - PORT=5000
      - CLIENT_ORIGIN=http://localhost:3000
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    networks:
      - taskmanager-net

  client:
    build: ./client
    container_name: taskmanager-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"
    networks:
      - taskmanager-net

volumes:
  mongo-data:
  uploads-data:

networks:
  taskmanager-net:
    driver: bridge
